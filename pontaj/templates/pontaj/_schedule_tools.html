{% load pontaj_tags %}
{% if can_edit %}
<div class="brushbar">
  <span class="brushbar-label">{% icon 'brush' 15 %}</span>
  {% for action, label, css in brushes %}
    <button type="button" class="brush {{ css }}" data-action="{{ action }}">{{ label }}</button>
  {% endfor %}
  <button type="button" class="brush brush-clear" data-action="clear" title="Golește celula">Golește</button>
  <span class="brush-hint">Atinge sau trage peste celule ca să aplici · Esc pentru ieșire</span>
</div>
{% else %}
<div class="legend">
  {% for css, label in legend %}<span><i class="{{ css }}"></i>{{ label }}</span>{% endfor %}
</div>
{% endif %}
