{% load static pontaj_tags %}<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6b84">
<title>Autentificare · Unda</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%230b6b84%27/%3E%3Cpath d=%27M4 12c2-3 4-3 6 0s4 3 6 0%27 stroke=%27white%27 stroke-width=%272.4%27 fill=%27none%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="{% static 'pontaj/app.css' %}">
</head>
<body>
<div class="login">
  <form class="card login-card" method="post">
    {% csrf_token %}
    <div class="brand">
      <span class="brand-mark">{% icon 'wave' 18 %}</span>
      <span>Unda<small>Pontaj bucătărie</small></span>
    </div>
    {% if error %}<div class="alert error">Utilizator sau parolă greșită.</div>{% endif %}
    <div class="field">
      <label for="id_username">Utilizator</label>
      <input type="text" name="username" id="id_username" autocomplete="username" autocapitalize="none"
             value="{{ username }}" required autofocus>
      <div class="help">Angajații intră cu <b>angajat</b>.</div>
    </div>
    <div class="field">
      <label for="id_password">Parolă</label>
      <input type="password" name="password" id="id_password" autocomplete="current-password" required>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn primary block" style="height:44px">Intră</button>
  </form>
</div>
</body>
</html>
