{% load static %}<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Autentificare · Unda</title>
{% include 'pontaj/_head_assets.html' %}
</head>
<body>
<div class="login">
  <form class="login-card" method="post">
    {% csrf_token %}
    <div class="wordmark">unda<i></i><span>pontaj</span></div>
    {% if error %}<div class="alert error">Utilizator sau parolă greșită.</div>{% endif %}
    <div class="field">
      <label for="id_username">Utilizator</label>
      <input type="text" name="username" id="id_username" autocomplete="username" autocapitalize="none"
             value="{{ username }}" required autofocus>
    </div>
    <div class="field">
      <label for="id_password">Parolă</label>
      <input type="password" name="password" id="id_password" autocomplete="current-password" required>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn primary block" style="height:42px">Intră</button>
    <p class="help" style="margin-top:14px">Angajații intră cu utilizatorul <b>angajat</b>.</p>
  </form>
</div>
</body>
</html>
